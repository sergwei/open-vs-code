# Release workflow for open-vs-code (issue #43).
#
# Pushing a tag `vX.Y.Z` builds ONE .vsix, checks it, and publishes that same file to the VS Code
# Marketplace and then to Open VSX, after a manual approval in the `release` environment. Any
# other trigger (`workflow_dispatch`, or a pull request that touches this file, the check
# scripts, `package.json`, `package-lock.json` or `.vscodeignore`) is a DRY RUN: it packages and
# checks exactly the same way but has no job that can read a token, so it cannot publish. The
# how-to (one-time setup, cutting a release, leaks) is in docs/RELEASING.md.
#
# Steps that use a pipe set `shell: bash` (which adds `pipefail`; the default `bash -e` does not),
# so a failing command at the left of a pipe fails the step instead of passing an empty list on.
#
# Decisions:
# - Three layers against publishing by mistake, weakest first: (1) the `if:` on the publish jobs;
#   (2) the dry run has no job that references the environment, so it cannot read the tokens;
#   (3) the `release` environment itself (tags `v*` only, required reviewer): the real boundary,
#   because a modified copy of this file on a branch or fork cannot skip it.
# - Package once, publish the same file twice: what is approved is what is published. `vsce publish
#   --packagePath` does not re-run `vscode:prepublish` nor re-package.
# - Stable releases only (decision of issue #43): no `--pre-release` anywhere. The Marketplace
#   rejects semver suffixes, so tags are `vMAJOR.MINOR.PATCH`.
# - Tokens (`VSCE_PAT`, `OVSX_PAT`) are environment secrets, appear only in the `env:` of the steps
#   that use them (the token check and the publish step of each job) and never on a command line
#   (vsce and ovsx read them from the environment). Dependencies are installed with
#   `--ignore-scripts` in the jobs that hold a token, and without the npm cache, so a cache
#   written by another run cannot reach a job that holds a token. The package job passes the
#   sha256 of the .vsix as an output and each publish step checks it before publishing.
# - The Open VSX job needs the Marketplace job: if the Marketplace rejects the package (for
#   instance the display name), nothing is published to Open VSX and the two listings never
#   diverge. It has no `id-token: write`, or ovsx would try trusted publishing instead of the PAT.
# - Actions are pinned to a commit SHA with the tag in a comment, like ci.yml. This workflow does
#   not call ci.yml: the gates are check-types and lint (through `vscode:prepublish`), format
#   check and unit tests on Linux, plus the check that the tagged commit is on `main`, where CI
#   already ran the three-OS matrix and the integration tests.
#
# UNVERIFIED until the first run: the dry run on the pull request (and then on `main`) is the
# only part exercised before a tag. Never exercised without publishing: the environment and its
# approval, the validity of the tokens, that `vsce publish --packagePath` and `ovsx publish`
# accept the .vsix, and whether the Marketplace accepts the display name.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch: {}
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/release.yml'
      - 'scripts/check-release.mjs'
      - 'scripts/check-vsix.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.vscodeignore'

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      version: ${{ steps.check.outputs.version }}
      vsix: ${{ steps.package.outputs.vsix }}
      sha256: ${{ steps.package.outputs.sha256 }}
    env:
      IS_TAG: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Check tag, version and changelog
        id: check
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [ "$IS_TAG" = "true" ]; then
            node scripts/check-release.mjs --tag "$TAG"
          else
            node scripts/check-release.mjs --dry-run
          fi

      - name: Check the tagged commit is on main
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$(git rev-parse HEAD)" refs/remotes/origin/main; then
            echo "::error::The tagged commit is not on main. Tag a commit that is already merged."
            exit 1
          fi

      - name: Format check
        run: npm run format:check

      - name: Unit tests
        run: npm test

      - name: Create canary files
        run: |
          printf 'canary\n' > CLAUDE.md
          mkdir -p .claude
          printf 'canary\n' > .claude/canary.md

      # `vscode:prepublish` runs check-types, lint and the production builds before vsce packs.
      - name: Package
        id: package
        shell: bash
        env:
          VERSION: ${{ steps.check.outputs.version }}
          REF: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.ref_name || github.sha }}
        run: |
          VSIX="$RUNNER_TEMP/open-vs-code-$VERSION.vsix"
          npm run vsix -- -o "$VSIX" --githubBranch "$REF"
          echo "vsix=open-vs-code-$VERSION.vsix" >> "$GITHUB_OUTPUT"
          echo "path=$VSIX" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$VSIX" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Check package contents
        shell: bash
        env:
          VERSION: ${{ steps.check.outputs.version }}
          VSIX: ${{ steps.package.outputs.path }}
        run: |
          # The real content of the .vsix. check-vsix.mjs --from-vsix keeps the entries under
          # `extension/` and undoes the renames vsce makes (readme.md, changelog.md, LICENSE.txt).
          unzip -Z1 "$VSIX" > "$RUNNER_TEMP/vsix-files.txt"
          node scripts/check-vsix.mjs --from-vsix "$RUNNER_TEMP/vsix-files.txt"
          unzip -p "$VSIX" extension/package.json > "$RUNNER_TEMP/vsix-package.json"
          node scripts/check-release.mjs --dry-run --packaged "$RUNNER_TEMP/vsix-package.json"
          PRERELEASE='Microsoft.VisualStudio.Code.PreRelease" Value="true"'
          if unzip -p "$VSIX" extension.vsixmanifest | grep -q "$PRERELEASE"; then
            echo "::error::The package is marked as a pre-release; only stable releases are published."
            exit 1
          fi

      - name: Upload .vsix
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-vsix
          path: ${{ steps.package.outputs.path }}
          if-no-files-found: error
          retention-days: 90

      - name: Summary
        env:
          VERSION: ${{ steps.check.outputs.version }}
          SHA256: ${{ steps.package.outputs.sha256 }}
          TAG: ${{ github.ref_name }}
        run: |
          {
            if [ "$IS_TAG" = "true" ]; then
              echo "Publishing $TAG (stable release)"
            else
              echo "DRY RUN — nothing was published"
            fi
            echo
            echo "- version: $VERSION"
            echo "- commit: $GITHUB_SHA"
            echo "- sha256: $SHA256"
          } >> "$GITHUB_STEP_SUMMARY"

  publish-marketplace:
    name: publish-marketplace
    needs: [package]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    environment:
      name: release
      url: https://marketplace.visualstudio.com/items?itemName=sergwei.open-vs-code
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Install
        run: npm ci --ignore-scripts

      - name: Download .vsix
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-vsix
          path: ${{ runner.temp }}/vsix

      - name: Check the token
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "::error::VSCE_PAT is not set in the release environment"
            exit 1
          fi
          npx --no-install vsce verify-pat sergwei

      - name: Publish to the VS Code Marketplace
        shell: bash
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          VSIX: ${{ runner.temp }}/vsix/${{ needs.package.outputs.vsix }}
          SHA256: ${{ needs.package.outputs.sha256 }}
        run: |
          echo "$SHA256  $VSIX" | sha256sum -c -
          npx --no-install vsce publish --packagePath "$VSIX"

  publish-open-vsx:
    name: publish-open-vsx
    needs: [package, publish-marketplace]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    environment:
      name: release
      url: https://open-vsx.org/extension/sergwei/open-vs-code
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Install
        run: npm ci --ignore-scripts

      - name: Download .vsix
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-vsix
          path: ${{ runner.temp }}/vsix

      - name: Check the token
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo "::error::OVSX_PAT is not set in the release environment"
            exit 1
          fi
          npx --no-install ovsx verify-pat sergwei

      - name: Publish to Open VSX
        shell: bash
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
          VSIX: ${{ runner.temp }}/vsix/${{ needs.package.outputs.vsix }}
          SHA256: ${{ needs.package.outputs.sha256 }}
        run: |
          echo "$SHA256  $VSIX" | sha256sum -c -
          npx --no-install ovsx publish "$VSIX"
